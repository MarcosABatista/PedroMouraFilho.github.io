# nginx.conf — Servidor estático para o site Nuxt gerado (app-pedro)
# Escuta na porta 82 para não conflitar com a aplicação que já roda na VPS.

server {
    listen 82;
    listen [::]:82;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão para reduzir o tamanho das respostas
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Assets do Nuxt (_nuxt/) possuem hash no nome -> cache longo e imutável
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Demais arquivos estáticos (imagens, fontes, favicon)
    location ~* \.(?:ico|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|eot|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Rotas da SPA/site estático -> cai no index.html quando o arquivo não existe
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Não cacheia o HTML para sempre pegar a versão mais recente
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Página de erro padrão
    error_page 404 /index.html;
}
